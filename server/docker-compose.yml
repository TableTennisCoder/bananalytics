services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${BANANA_DB_USER:-bananalytics}"
      POSTGRES_PASSWORD: "${BANANA_DB_PASSWORD:?BANANA_DB_PASSWORD is not set. Copy .env.example to .env and generate one with: openssl rand -hex 24}"
      POSTGRES_DB: "${BANANA_DB_NAME:-bananalytics}"
    # No published port: the backend reaches Postgres over the internal Docker
    # network, so binding 5432 on the host would only expose the database to the
    # internet. Local access goes through `docker compose exec postgres psql`,
    # and docker-compose.dev.yml publishes the port for development.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker gives a container 64 MB of shared memory by default. Postgres puts
    # parallel worker results there, and a VACUUM or a parallel scan over a few
    # million rows asks for more than that — which fails as "No space left on
    # device" while the disk is nearly empty.
    shm_size: 256mb
    # Stock Postgres defaults assume a small machine with spinning disks. These
    # override the four that matter for an analytics workload; everything else
    # is left alone deliberately.
    #
    #   shared_buffers        the default 128 MB caches almost nothing
    #   work_mem              at 4 MB, GROUP BY and DISTINCT sort to disk
    #   random_page_cost      4.0 prices random reads for a mechanical drive
    #   effective_io_concurrency  1 keeps an SSD from being asked for more
    #
    # Sized for a 4 GB host. On a bigger box raise shared_buffers to about a
    # quarter of RAM and effective_cache_size to about three quarters.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # Measured, not assumed: JIT compilation cost more than it saved on every
      # aggregate query here — 44 functions compiled per run to shave nothing off
      # a sequential scan. Worth re-testing if the query mix changes.
      - -c
      - jit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BANANA_DB_USER:-bananalytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bananalytics:
    build: .
    # No public ports — Caddy handles external traffic
    expose:
      - "8080"
    environment:
      BANANA_PORT: "8080"
      BANANA_DB_DSN: "postgres://${BANANA_DB_USER:-bananalytics}:${BANANA_DB_PASSWORD}@postgres:5432/${BANANA_DB_NAME:-bananalytics}?sslmode=disable"
      BANANA_LOG_LEVEL: "${BANANA_LOG_LEVEL:-info}"
      BANANA_RATE_LIMIT_RPM: "1000"
      # Stated explicitly rather than defaulting to "*", so a production
      # deployment cannot silently accept requests from any origin.
      BANANA_CORS_ORIGINS: "${BANANA_CORS_ORIGINS:?BANANA_CORS_ORIGINS is not set. Put your dashboard origin in .env, e.g. https://analytics.example.com}"
      BANANA_DB_MAX_CONNS: "25"
      BANANA_DB_MIN_CONNS: "5"
      # GeoIP database path inside the container.
      # The ./geoip directory is mounted below — run scripts/download-geoip.sh
      # to populate it. If the file doesn't exist, GeoIP is silently disabled.
      BANANA_GEOIP_DB: "/app/geoip/GeoLite2-City.mmdb"
    volumes:
      # Mount the geoip directory read-only. If empty, GeoIP is disabled gracefully.
      - ./geoip:/app/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ../packages/dashboard
      dockerfile: Dockerfile
    # No public ports — Caddy fronts it on the same host as the API
    expose:
      - "3000"
    environment:
      # Server-side calls from Next.js to the Go backend (inside the docker network)
      BANANA_BACKEND_URL: "http://bananalytics:8080"
      NODE_ENV: "production"
    depends_on:
      bananalytics:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      BANANA_DOMAIN: "${BANANA_DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bananalytics
      - dashboard
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
